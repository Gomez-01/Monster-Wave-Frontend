<!-- Monster Energy Drink Catalog -->
<div class="max-w-7xl mx-auto p-6 bg-gray-50 min-h-screen">
  <header class="mb-8">
    <h1 class="text-4xl font-extrabold text-gray-900">Monster Energy Drink Catalog</h1>
  </header>

  <div class="flex flex-col lg:flex-row gap-8">
    
    <!-- Lado Esquerdo: Formulário com p-card -->
    <div class="w-full lg:w-1/3">
      <p-card [header]="editingId !== null ? 'Edit drink' : 'Add new drink'">
        <form (ngSubmit)="save()" class="space-y-6">
          <div class="flex flex-col gap-4">
            <p-iftalabel>
              <input pInputText id="name" [(ngModel)]="formModel.name" name="name" class="w-full" required/>
              <label for="name">Name</label>
            </p-iftalabel>

            <p-iftalabel>
              <input pInputText id="flavor" [(ngModel)]="formModel.flavor" name="flavor" class="w-full" required/>
              <label for="flavor">Flavor</label>
            </p-iftalabel>

            <p-iftalabel>
              <p-inputnumber [(ngModel)]="formModel.price" name="price" mode="currency" currency="BRL" locale="pt-BR" styleClass="w-full" />
              <label for="price">Price</label>
            </p-iftalabel>

            <p-iftalabel>
              <p-inputnumber [(ngModel)]="formModel.release" name="release" mode="decimal" [useGrouping]="false" styleClass="w-full" />
              <label for="release">Release year</label>
            </p-iftalabel>

            <div class="flex items-center gap-2 px-1">
              <input type="checkbox" [(ngModel)]="formModel.sugarFree" name="sugarFree" id="sugarFree" class="h-4 w-4 text-blue-600" />
              <label for="sugarFree" class="text-sm text-gray-700">Sugar free</label>
            </div>
          </div>

          <div class="flex gap-2 pt-4 border-t border-gray-100">
            <button pButton type="submit" 
                    [label]="editingId !== null ? 'Update' : 'Create'"
                    class="p-button-primary px-4 py-2">
            </button>
            <button pButton *ngIf="editingId !== null" type="button" 
                    (click)="cancel()" label="Cancel"
                    class="p-button-secondary p-button-outlined px-4 py-2">
            </button>
          </div>
        </form>
      </p-card>
    </div>

    <!-- Lado Direito: Tabela com p-card -->
    <div class="flex-1">
      <p-card header="Current Catalog">
        <p-table [value]="drinks" [rowHover]="true" responsiveLayout="scroll" styleClass="p-datatable-sm">
          <ng-template pTemplate="header">
            <tr>
              <th class="text-gray-600">Name</th>
              <th class="text-gray-600">Flavor</th>
              <th class="text-gray-600">Price</th>
              <th class="text-gray-600">Release</th>
              <th class="text-gray-600">Sugar-free</th>
              <th class="text-gray-600">Actions</th>
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-drink>
            <tr>
              <td>{{drink.name}}</td>
              <td>{{drink.flavor}}</td>
              <td>R$ {{drink.price.toFixed(2)}}</td>
              <td>{{drink.release}}</td>
              <td>
                <span [class]="drink.sugarFree ? 'text-green-600 font-medium' : 'text-gray-500'">
                  {{drink.sugarFree ? 'Yes' : 'No'}}
                </span>
              </td>
              <td>
                <div class="flex gap-3">
                  <button (click)="edit(drink)" class="text-blue-600 hover:underline font-medium">Edit</button>
                  <button (click)="delete(drink.id)" class="text-red-600 hover:underline font-medium">Delete</button>
                </div>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </p-card>
    </div>

  </div>
</div>
