<!-- Monster Energy Drink Catalog -->
<div class="max-w-7xl mx-auto p-6 bg-gray-50 min-h-screen">
  <header class="mb-8">
    <h1 class="text-4xl font-extrabold text-gray-900">Monster Energy Drink Catalog</h1>
  </header>

  <div class="flex flex-col lg:flex-row gap-8">
    <!-- Form Card -->
    <div class="bg-white p-6 rounded-xl shadow-md w-full lg:w-1/3">
      <h2 class="text-2xl font-bold mb-6 text-gray-800">
        {{ editingId !== null ? 'Edit drink' : 'Add new drink' }}
      </h2>
      
      <form (ngSubmit)="save()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Name</label>
          <input [(ngModel)]="formModel.name" name="name" class="w-full mt-1 p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500" placeholder="Ex: Ultra White" required />
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700">Flavor</label>
          <input [(ngModel)]="formModel.flavor" name="flavor" class="w-full mt-1 p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500" placeholder="Ex: Orange Citrus" required />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Price (R$)</label>
          <input [(ngModel)]="formModel.price" name="price" type="number" step="0.1" class="w-full mt-1 p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Release year</label>
          <input [(ngModel)]="formModel.release" name="release" type="number" class="w-full mt-1 p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500" />
        </div>

        <div class="flex items-center gap-2">
          <input type="checkbox" [(ngModel)]="formModel.sugarFree" name="sugarFree" class="h-4 w-4 text-blue-600 rounded" />
          <label class="text-sm text-gray-700">Sugar free</label>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
            {{ editingId !== null ? 'Update' : 'Create' }}
          </button>
          <button *ngIf="editingId !== null" type="button" (click)="cancel()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 transition">
            Cancel
          </button>
        </div>
      </form>
    </div>

    <!-- Table Section -->
    <div class="bg-white p-6 rounded-xl shadow-md flex-1">
      <h2 class="text-2xl font-bold mb-6 text-gray-800">Current Catalog</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-gray-200">
              <th class="py-3 px-2 text-gray-600">Name</th>
              <th class="py-3 px-2 text-gray-600">Flavor</th>
              <th class="py-3 px-2 text-gray-600">Price</th>
              <th class="py-3 px-2 text-gray-600">Release</th>
              <th class="py-3 px-2 text-gray-600">Sugar-free</th>
              <th class="py-3 px-2 text-gray-600">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let drink of drinks" class="border-b border-gray-100 hover:bg-gray-50 transition">
              <td class="py-3 px-2">{{drink.name}}</td>
              <td class="py-3 px-2">{{drink.flavor}}</td>
              <td class="py-3 px-2">R$ {{drink.price.toFixed(2)}}</td>
              <td class="py-3 px-2">{{drink.release}}</td>
              <td class="py-3 px-2">{{drink.sugarFree ? 'Yes' : 'No'}}</td>
              <td class="py-3 px-2 flex gap-2">
                <button (click)="edit(drink)" class="text-blue-600 hover:text-blue-800">Edit</button>
                <button (click)="delete(drink.id)" class="text-red-600 hover:text-red-800">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
